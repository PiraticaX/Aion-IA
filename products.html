<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products - AION-IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="hero" style="min-height:55svh">
    <div class="domain-canvas" data-mode="circuit" aria-hidden="true" style="opacity:.3"></div>
    <div class="wrap hero-content">
      <div class="hero-eyebrow">COMPANY &nbsp;/&nbsp; PRODUCTS</div>
      <h1>From research to systems.</h1>
      <p class="hero-sub">Five products carry AION-IA's research into logistics, finance, security and imaging.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div id="productList"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="data/data.js"></script>
<script src="js/main.js"></script>
<script>
(function(){
  var host = document.getElementById("productList");
  AION_PRODUCTS.forEach(function(p){
    var el = document.createElement("div");
    el.className = "product-row reveal";
    el.innerHTML = '<div><span class="index">'+p.num+'</span></div>' +
      '<div><h3>'+p.name+'</h3><p style="margin-top:.8rem">'+p.description+'</p>' +
      '<div class="product-tags"><span>'+p.tech+'</span><span>&middot;</span><span>'+p.application+'</span></div>' +
      '<div class="product-status">'+p.status+'</div></div>';
    host.appendChild(el);
  });
})();
</script>
</body>
</html>
